name: CI

on:
  pull_request:
  push:
    # `develop` entra el 2026-08-26 con la FASE 3. Desde hoy el trabajo aterriza ahi y no en `main`:
    # dejar solo `main` habria hecho que el push que de verdad integra el cambio no ejecutara nada,
    # y que la primera senal llegara en la release. Las PRs ya lo disparan; esto cubre el push de
    # despues del merge.
    branches: [main, develop]

permissions:
  contents: read

# Every push to `develop` or `main` gets its own run and its own verdict (a group per run): without
# one verdict per pushed commit, develop-health cannot tie a red to one merge (it would see two
# commits between the last green and the first red and escalate instead of reverting).
# Concurrency (studio#276): solo se cancela lo que un commit NUEVO deja viejo.
#   - `opened` y `synchronize` comparten un grupo por PR y cancelan la run en curso: la cancelada
#     es la de un commit que ya no es la cabeza.
#   - Los demas eventos de PR (`reopened`, `labeled`, `edited`...) van a un grupo por PR y commit
#     SIN cancelar: nunca matan la run en curso ni la del commit nuevo. Si GitHub descarta una run
#     PENDIENTE del grupo, sale `cancelled` sin jobs y no deja check en la cabeza.
#   - Push, `workflow_dispatch` y `schedule` van a un grupo por run: nadie los cancela, y cada
#     commit de develop/main tiene su CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && (contains(fromJSON('["opened","synchronize"]'), github.event.action) && format('pr-{0}', github.event.pull_request.number) || format('pr-{0}-{1}', github.event.pull_request.number, github.event.pull_request.head.sha)) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && contains(fromJSON('["opened","synchronize"]'), github.event.action) }}

jobs:
  build:
    name: typecheck + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm must be installed before setup-node so `cache: pnpm` can find it.
      - name: El gestor de paquetes va pineado por hash
        # `packageManager` sin `+sha512...` deja que corepack acepte la version por
        # NOMBRE: quien sirva ese tarball decide que se ejecuta antes que cualquier
        # otro gate. Es el mismo pin que este repo ya exige a todas sus actions
        # (SHA, no tag); no tenerlo aqui era una incoherencia, no una preferencia.
        #
        # Salta en la PR del bot, que es donde hay que enterarse: el bump de pnpm
        # sustituye el valor entero y se lleva el hash por delante sin avisar.
        run: |
          pm=$(node -p "require('./package.json').packageManager || ''")
          case "$pm" in
            *"+sha512."*) echo "OK: $pm" ;;
            "") echo "::error::package.json no declara packageManager"; exit 1 ;;
            *) echo "::error::packageManager sin hash de integridad: '$pm'. Regeneralo con 'corepack use pnpm@<version>', que lo escribe el."; exit 1 ;;
          esac

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test
